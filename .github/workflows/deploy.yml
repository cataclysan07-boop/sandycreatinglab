name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/bar-discovery-app-6Ueu5]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bar-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bar-app

      - name: Build
        run: npm run build
        working-directory: bar-app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bar-app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
